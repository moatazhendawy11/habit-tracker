<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Habit Tracker</h1>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__label">Dark mode</span>
      </button>
    </header>

    <form class="add-habit" id="add-habit-form">
      <label class="add-habit__label" for="habit-name">New habit</label>
      <input
        class="add-habit__input"
        id="habit-name"
        name="habit-name"
        type="text"
        placeholder="e.g. Stretching"
        autocomplete="off">
      <button class="add-habit__button" type="submit">Add habit</button>
    </form>

    <div class="table-scroll">
      <table class="habits">
        <caption class="visually-hidden">Habits by day. Tick a box to mark a habit complete for that day.</caption>
        <thead>
          <tr id="habits-head"></tr>
        </thead>
        <tbody id="habits-body"></tbody>
        <tfoot>
          <tr id="habits-foot"></tr>
        </tfoot>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
